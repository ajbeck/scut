name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose assets should be rebuilt and uploaded.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      commit_sha: ${{ steps.release-context.outputs.commit_sha }}
      major_tag: ${{ steps.release-context.outputs.major_tag }}
      minor_tag: ${{ steps.release-context.outputs.minor_tag }}
      release_created: ${{ steps.release.outputs.release_created }}
      release_tag: ${{ steps.release-context.outputs.release_tag }}
      release_version: ${{ steps.release-context.outputs.release_version }}
    steps:
      - name: Create release automation token
        id: release-token
        if: ${{ vars.RELEASE_PLEASE_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create or update release pull request or GitHub release
        id: release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.release-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Sync pending release pull request
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_pr="$(gh pr list \
            --base main \
            --state open \
            --label 'autorelease: pending' \
            --json number \
            --jq '.[0].number')"

          if [[ -z "$release_pr" ]]; then
            echo 'No pending release pull request to sync.'
            exit 0
          fi

          merge_state="$(gh pr view "$release_pr" --json mergeStateStatus --jq '.mergeStateStatus')"
          if [[ "$merge_state" != 'BEHIND' ]]; then
            echo "Release PR #$release_pr does not need a branch update ($merge_state)."
            exit 0
          fi

          head_sha="$(gh pr view "$release_pr" --json headRefOid --jq '.headRefOid')"
          gh api \
            --method PUT \
            "repos/$GITHUB_REPOSITORY/pulls/$release_pr/update-branch" \
            -f expected_head_sha="$head_sha"

      - name: Configure release asset packaging
        id: release-context
        if: ${{ steps.release.outputs.release_created == 'true' || inputs.release_tag != '' }}
        env:
          AUTOMATED_RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          AUTOMATED_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ steps.release-token.outputs.token || github.token }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          release_tag="${MANUAL_RELEASE_TAG:-$AUTOMATED_RELEASE_TAG}"
          release_version="${AUTOMATED_RELEASE_VERSION:-${release_tag#v}}"
          if [[ ! "$release_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag must identify a stable semantic version: $release_tag" >&2
            exit 1
          fi

          gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null
          commit_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_tag" --jq '.sha')"

          {
            echo "commit_sha=$commit_sha"
            echo "major_tag=v${BASH_REMATCH[1]}"
            echo "minor_tag=v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            echo "release_tag=$release_tag"
            echo "release_version=$release_version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: release-please
    if: ${{ needs.release-please.outputs.release_tag != '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build.yaml
    with:
      mode: release
      ref: ${{ needs.release-please.outputs.release_tag }}
      release_tag: ${{ needs.release-please.outputs.release_tag }}

  publish:
    name: Publish Release Assets
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Checkout release commit
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.commit_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Update movable release tags
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        env:
          COMMIT_SHA: ${{ needs.release-please.outputs.commit_sha }}
          MAJOR_TAG: ${{ needs.release-please.outputs.major_tag }}
          MINOR_TAG: ${{ needs.release-please.outputs.minor_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MINOR_TAG" "$COMMIT_SHA"
          git tag -f "$MAJOR_TAG" "$COMMIT_SHA"
          git push --force origin "refs/tags/$MINOR_TAG" "refs/tags/$MAJOR_TAG"

      - name: Write release summary
        env:
          COMMIT_SHA: ${{ needs.release-please.outputs.commit_sha }}
          MAJOR_TAG: ${{ needs.release-please.outputs.major_tag }}
          MINOR_TAG: ${{ needs.release-please.outputs.minor_tag }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Release Summary

          | Item | Value |
          |------|-------|
          | Release | \`${RELEASE_TAG}\` |
          | Commit | [\`${COMMIT_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}) |
          | Movable tags | \`${MINOR_TAG}\`, \`${MAJOR_TAG}\` |

          ### Assets

          - \`scut-${RELEASE_TAG}-darwin-amd64.tar.gz\`
          - \`scut-${RELEASE_TAG}-darwin-arm64.tar.gz\`
          - \`scut-${RELEASE_TAG}-linux-amd64.tar.gz\`
          - \`scut-${RELEASE_TAG}-linux-arm64.tar.gz\`
          - \`checksums.txt\`
          EOF

  update-homebrew-tap:
    name: Open Homebrew Tap Update
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create release publisher token
        id: release-publisher-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.AJBECK_RELEASE_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.AJBECK_RELEASE_PUBLISHER_KEY }}
          owner: ajbeck
          repositories: homebrew-tap
          permission-actions: write

      - name: Trigger Homebrew tap update
        env:
          GH_TOKEN: ${{ steps.release-publisher-token.outputs.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
        run: |
          gh api repos/ajbeck/homebrew-tap/actions/workflows/update-formula.yml/dispatches \
            --method POST \
            -f ref=main \
            -f inputs[formula]=scut \
            -f inputs[version]="$RELEASE_TAG"

      - name: Write Homebrew tap summary
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Homebrew Tap

          Opened the separately managed \`ajbeck/homebrew-tap\` formula update workflow for \`scut\` ${RELEASE_TAG}.
          EOF

  deploy-docs:
    name: Deploy Docs
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.commit_sha }}
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        uses: ./.github/actions/setup-hugo
        with:
          version: 0.162.1

      - name: Build docs
        run: |
          hugo --source docs \
            --gc \
            --minify \
            --baseURL "https://scut.ajbeck.dev/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
